    <title>14 Basic Bible Verses v3</title>
    <style>
        * {

        }

            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stats-bar {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            margin-top: 15px;
            border-radius: 10px;
            font-size: 0.9em;
            display: flex;
            justify-content: space-around;
        }

        .install-banner {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            display: none;
            cursor: pointer;
        }

        .install-banner.show {
            display: block;
        }

        .resume-banner {
            background: #FF9800;
            color: white;
            padding: 15px;
            text-align: center;
            display: none;
            cursor: pointer;
        }

        .resume-banner.show {
            display: block;
        }

        .mode-selection {
            padding: 30px;
            text-align: center;
        }

        .mode-selection h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 200px;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Settings Button */
        .settings-btn {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            background: #6c757d;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-close {
            float: right;
            font-size: 2em;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            line-height: 0.8;
        }

        .modal-close:hover {
            color: #333;
        }

        .practice-area {
            display: none;
            padding: 30px;
        }

        .progress {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .topic-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
        }

        .bookmark-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .bookmark-btn:hover {
            transform: scale(1.2);
        }

        .topic-title {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .verse-reference {
            font-size: 1.5em;
            color: #764ba2;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .verse-content {
            display: none;
            font-size: 1.3em;
            line-height: 1.8;
            color: #333;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            margin: 20px 0;
        }

        .verse-content.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Navigation Controls */
        .navigation-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 20px;
            font-size: 1.3em;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 60px;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .toggle-btn {
            padding: 12px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            background: #28a745;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 150px;
        }

        .toggle-btn.hide-mode {
            background: #FF9800;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-warning {
            background: #FF9800;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .completion-message {
            text-align: center;
            padding: 40px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .completion-message h2 {
            color: #28a745;
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        .offline-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #f44336;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            display: none;
        }

        .offline-indicator.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📖 14 Basic Bible Verses v3</h1>
            <div class="stats-bar">
                <span>📊 練習: <span id="totalPracticed">0</span> 次</span>
                <span>🔖 書籤: <span id="bookmarkCount">0</span></span>
                <span>📅 <span id="lastPractice">未練習</span></span>
            </div>
        </div>

        <div class="install-banner" id="installBanner">
            🎯 點擊安裝到主畫面！ Click to install on home screen!
        </div>

        <div class="resume-banner" id="resumeBanner">
            🔄 繼續上次練習 | Resume from last session
        </div>

        <div class="mode-selection" id="modeSelection">
            <h2>選擇練習模式 | Choose Practice Mode</h2>
            <div class="mode-buttons">
                <button class="mode-btn" onclick="startMode(1)">模式一：順序練習<br>Sequential</button>
                <button class="mode-btn" onclick="startMode(2)">模式二：隨機練習<br>Random</button>
                <button class="mode-btn" onclick="startMode(3)">模式三：複習全部<br>Review All</button>
                <button class="mode-btn" onclick="startMode(4)">模式四：我的書籤<br>My Bookmarks</button>
            </div>
            <button class="settings-btn" onclick="toggleSettings()">⚙️ 設定 | Settings</button>
        </div>

        <div class="practice-area" id="practiceArea">
            <div class="progress">
                <div>進度 Progress: <span id="progressText">0/0</span></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="topic-card" id="verseCard">
                <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()">☆</button>
                <div class="topic-title" id="topicTitle"></div>
                <div class="verse-reference" id="verseReference"></div>
                <div class="verse-content" id="verseContent"></div>
            </div>

            <div class="navigation-controls">
                <button class="nav-btn" id="prevBtn" onclick="previousVerse()">←</button>
                <button class="toggle-btn" id="toggleBtn" onclick="toggleVerse()">Reveal 顯示</button>
                <button class="nav-btn" id="nextBtn" onclick="nextVerse()">→</button>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="backToMenu()">⬅ Back to Menu 回選單</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <span class="modal-close" onclick="toggleSettings()">&times;</span>
            <div class="modal-header">⚙️ 設定 | Settings</div>
            <div class="action-buttons" style="flex-direction: column;">
                <button class="btn btn-primary" onclick="viewStats()">📊 查看統計 | View Statistics</button>
                <button class="btn btn-success" onclick="exportData()">📤 匯出資料 | Export Data</button>
                <button class="btn btn-danger" onclick="resetProgress()">🔄 重置全部 | Reset All Progress</button>
            </div>
        </div>
    </div>

    <div class="offline-indicator" id="offlineIndicator">
        📵 Offline Mode
    </div>

    <script>
        const STORAGE_KEY = '14basic_progress_v3';
        const BOOKMARK_KEY = '14basic_bookmarks_v3';

        const verses = [
            // SALVATION 救恩
            { topic: "SALVATION 救恩", ref: "約翰福音 3:16 | John 3:16", text: "神愛世人，甚至將祂的獨生子賜給他們，叫一切信祂的不至滅亡，反得永生。For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life." },
            { topic: "SALVATION 救恩", ref: "羅馬書 3:23 | Romans 3:23", text: "因為世人都犯了罪，虧缺了神的榮耀。For all have sinned and fall short of the glory of God." },
            { topic: "SALVATION 救恩", ref: "羅馬書 6:23 | Romans 6:23", text: "因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord." },
            { topic: "SALVATION 救恩", ref: "羅馬書 5:8 | Romans 5:8", text: "惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。But God demonstrates His own love toward us, in that while we were still sinners, Christ died for us." },

            // ASSURANCE 確據
            { topic: "ASSURANCE 確據", ref: "約翰一書 5:11-12 | 1 John 5:11-12", text: "這見證就是神賜給我們永生，這永生也是在祂兒子裡面。人有了神的兒子就有生命，沒有神的兒子就沒有生命。And this is the testimony: that God has given us eternal life, and this life is in His Son. He who has the Son has life; he who does not have the Son of God does not have life." },
            { topic: "ASSURANCE 確據", ref: "約翰福音 5:24 | John 5:24", text: "我實實在在地告訴你們：那聽我話、又信差我來者的，就有永生，不至於定罪，是已經出死入生了。Most assuredly, I say to you, he who hears My word and believes in Him who sent Me has everlasting life, and shall not come into judgment, but has passed from death into life." },
            { topic: "ASSURANCE 確據", ref: "約翰福音 10:28 | John 10:28", text: "我又賜給他們永生，他們永不滅亡，誰也不能從我手裡把他們奪去。And I give them eternal life, and they shall never perish; neither shall anyone snatch them out of My hand." },
            { topic: "ASSURANCE 確據", ref: "彼得前書 1:21 | 1 Peter 1:21", text: "你們也因著祂，信那叫祂從死裡復活、又給祂榮耀的神，叫你們的信心和盼望都在於神。who through Him believe in God, who raised Him from the dead and gave Him glory, so that your faith and hope are in God." },

            // SECURITY 穩固
            { topic: "SECURITY 穩固", ref: "約翰福音 10:27-28 | John 10:27-28", text: "我的羊聽我的聲音，我也認識他們，他們也跟著我。我又賜給他們永生，他們永不滅亡，誰也不能從我手裡把他們奪去。My sheep hear My voice, and I know them, and they follow Me. And I give them eternal life, and they shall never perish; neither shall anyone snatch them out of My hand." },
            { topic: "SECURITY 穩固", ref: "羅馬書 8:38-39 | Romans 8:38-39", text: "因為我深信：無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們的主基督耶穌裡的。For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come, nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord." },
            { topic: "SECURITY 穩固", ref: "彼得前書 1:3-5 | 1 Peter 1:3-5", text: "願頌讚歸於我們主耶穌基督的父神，祂曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望，可以得著不能朽壞、不能玷污、不能衰殘、為你們存留在天上的基業。你們這因信蒙神能力保守的人，必能得著所預備、到末世要顯現的救恩。Blessed be the God and Father of our Lord Jesus Christ, who according to His abundant mercy has begotten us again to a living hope through the resurrection of Jesus Christ from the dead, to an inheritance incorruptible and undefiled and that does not fade away, reserved in heaven for you, who are kept by the power of God through faith for salvation ready to be revealed in the last time." },
            { topic: "SECURITY 穩固", ref: "約翰福音 6:37 | John 6:37", text: "凡父所賜給我的人，必到我這裡來；到我這裡來的，我總不丟棄他。All that the Father gives Me will come to Me, and the one who comes to Me I will by no means cast out." },

            // SEPARATION 分別
            { topic: "SEPARATION 分別", ref: "哥林多後書 6:14 | 2 Corinthians 6:14", text: "你們和不信的原不相配，不要同負一軛。義和不義有什麼相交呢？光明和黑暗有什麼相通呢？Do not be unequally yoked together with unbelievers. For what fellowship has righteousness with lawlessness? And what communion has light with darkness?" },
            { topic: "SEPARATION 分別", ref: "哥林多後書 6:17-18 | 2 Corinthians 6:17-18", text: "又說：『你們務要從他們中間出來，與他們分別，不要沾不潔淨的物，我就收納你們。我要作你們的父，你們要作我的兒女。』這是全能的主說的。Therefore 'Come out from among them And be separate, says the Lord. Do not touch what is unclean, And I will receive you.' 'I will be a Father to you, And you shall be My sons and daughters, Says the LORD Almighty.'" },
            { topic: "SEPARATION 分別", ref: "約翰一書 2:15-16 | 1 John 2:15-16", text: "不要愛世界和世界上的事。人若愛世界，愛父的心就不在他裡面了。因為凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。Do not love the world or the things in the world. If anyone loves the world, the love of the Father is not in him. For all that is in the world—the lust of the flesh, the lust of the eyes, and the pride of life—is not of the Father but is of the world." },
            { topic: "SEPARATION 分別", ref: "羅馬書 12:1-2 | Romans 12:1-2", text: "所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉乃是理所當然的。不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。I beseech you therefore, brethren, by the mercies of God, that you present your bodies a living sacrifice, holy, acceptable to God, which is your reasonable service. And do not be conformed to this world, but be transformed by the renewing of your mind, that you may prove what is that good and acceptable and perfect will of God." },

            // CHRISTIAN LIFE 基督徒生活
            { topic: "CHRISTIAN LIFE 基督徒生活", ref: "羅馬書 12:1 | Romans 12:1", text: "所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉乃是理所當然的。I beseech you therefore, brethren, by the mercies of God, that you present your bodies a living sacrifice, holy, acceptable to God, which is your reasonable service." },
            { topic: "CHRISTIAN LIFE 基督徒生活", ref: "加拉太書 2:20 | Galatians 2:20", text: "我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活，祂是愛我，為我捨己。I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me." },
            { topic: "CHRISTIAN LIFE 基督徒生活", ref: "馬太福音 6:33 | Matthew 6:33", text: "你們要先求祂的國和祂的義，這些東西都要加給你們了。But seek first the kingdom of God and His righteousness, and all these things shall be added to you." },
            { topic: "CHRISTIAN LIFE 基督徒生活", ref: "約翰福音 15:5,7 | John 15:5,7", text: "我是葡萄樹，你們是枝子；常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做什麼。你們若常在我裡面，我的話也常在你們裡面；凡你們所願意的，祈求就給你們成就。I am the vine, you are the branches. He who abides in Me, and I in him, bears much fruit; for without Me you can do nothing. If you abide in Me, and My words abide in you, you will ask what you desire, and it shall be done for you." },

        let currentMode = 0;
        let currentIndex = 0;
        let practiceVerses = [];
        let bookmarks = [];
        let isRevealed = false;

        // Load saved data
        function loadSavedData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            const savedBookmarks = localStorage.getItem(BOOKMARK_KEY);

            if (savedBookmarks) {
                bookmarks = JSON.parse(savedBookmarks);
            }

            updateStats();

            if (saved) {
                const data = JSON.parse(saved);
                if (data.index > 0 && data.index < verses.length) {
                    document.getElementById('resumeBanner').classList.add('show');
                    document.getElementById('resumeBanner').onclick = () => resumeSession(data);
                }
            }
        }

        function resumeSession(data) {
            startMode(data.mode);
            currentIndex = data.index;
            showVerse();
        }

        function updateStats() {
            document.getElementById('totalPracticed').textContent = localStorage.getItem('totalPracticed') || '0';
            document.getElementById('bookmarkCount').textContent = bookmarks.length;
            document.getElementById('lastPractice').textContent = localStorage.getItem('lastPractice') || '未練習';
        }

        function saveProgress() {
            const data = {
                mode: currentMode,
                index: currentIndex,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarks));

            const practiced = parseInt(localStorage.getItem('totalPracticed') || '0');
            localStorage.setItem('totalPracticed', practiced.toString());
            localStorage.setItem('lastPractice', new Date().toLocaleDateString());

            updateStats();
        }

        function startMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            isRevealed = false;

            document.getElementById('modeSelection').classList.add('hidden');
            document.getElementById('practiceArea').classList.remove('hidden');

            if (mode === 1) {
                practiceVerses = verses.slice();
            } else if (mode === 2) {
                practiceVerses = verses.slice().sort(() => Math.random() - 0.5);
            } else if (mode === 3) {
                practiceVerses = verses.slice();
            } else if (mode === 4) {
                practiceVerses = verses.filter((_, idx) => bookmarks.includes(idx));
                if (practiceVerses.length === 0) {
                    alert('沒有書籤！請先在其他模式中標記一些經文。

No bookmarks! Please bookmark some verses in other modes first.');
                    backToMenu();
                    return;
                }
            }

            showVerse();
        }

        function showVerse() {
            if (currentIndex >= practiceVerses.length) {
                showCompletion();
                return;
            }

            const verse = practiceVerses[currentIndex];
            const verseIdx = verses.indexOf(verse);

            document.getElementById('topicTitle').textContent = verse.topic;
            document.getElementById('verseReference').textContent = verse.ref;
            document.getElementById('verseContent').textContent = verse.text;
            document.getElementById('verseContent').classList.remove('show');

            document.getElementById('bookmarkBtn').textContent = bookmarks.includes(verseIdx) ? '★' : '☆';

            document.getElementById('progressText').textContent = `${currentIndex + 1}/${practiceVerses.length}`;
            const percent = ((currentIndex + 1) / practiceVerses.length) * 100;
            document.getElementById('progressFill').style.width = percent + '%';

            // Reset toggle button
            isRevealed = false;
            document.getElementById('toggleBtn').textContent = 'Reveal 顯示';
            document.getElementById('toggleBtn').classList.remove('hide-mode');

            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex >= practiceVerses.length - 1;

            saveProgress();
        }

        function toggleVerse() {
            const verseContent = document.getElementById('verseContent');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isRevealed) {
                // Hide the verse
                verseContent.classList.remove('show');
                toggleBtn.textContent = 'Reveal 顯示';
                toggleBtn.classList.remove('hide-mode');
                isRevealed = false;
            } else {
                // Show the verse
                verseContent.classList.add('show');
                toggleBtn.textContent = 'Hide 隱藏';
                toggleBtn.classList.add('hide-mode');
                isRevealed = true;

                // Increment practice counter
                const practiced = parseInt(localStorage.getItem('totalPracticed') || '0') + 1;
                localStorage.setItem('totalPracticed', practiced.toString());
                localStorage.setItem('lastPractice', new Date().toLocaleDateString());
                updateStats();
            }
        }

        function previousVerse() {
            if (currentIndex > 0) {
                currentIndex--;
                showVerse();
            }
        }

        function nextVerse() {
            if (currentIndex < practiceVerses.length - 1) {
                currentIndex++;
                showVerse();
            }
        }

        function toggleBookmark() {
            const verse = practiceVerses[currentIndex];
            const verseIdx = verses.indexOf(verse);

            if (bookmarks.includes(verseIdx)) {
                bookmarks = bookmarks.filter(b => b !== verseIdx);
                document.getElementById('bookmarkBtn').textContent = '☆';
            } else {
                bookmarks.push(verseIdx);
                document.getElementById('bookmarkBtn').textContent = '★';
            }

            localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarks));
            updateStats();
        }

        function showCompletion() {
            document.getElementById('practiceArea').innerHTML = `
                <div class="completion-message">
                    <h2>🎉 完成！ Completed!</h2>
                    <p>你已經完成所有經文的練習！</p>
                    <p>You have completed all verses!</p>
                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="startMode(currentMode)">🔄 重新開始 | Restart</button>
                        <button class="btn btn-secondary" onclick="backToMenu()">⬅ 回選單 | Back to Menu</button>
                    </div>
                </div>
            `;
        }

        function backToMenu() {
            document.getElementById('modeSelection').classList.remove('hidden');
            document.getElementById('practiceArea').classList.add('hidden');
            document.getElementById('practiceArea').innerHTML = `
                <div class="progress">
                    <div>進度 Progress: <span id="progressText">0/0</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="topic-card" id="verseCard">
                    <button class="bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()">☆</button>
                    <div class="topic-title" id="topicTitle"></div>
                    <div class="verse-reference" id="verseReference"></div>
                    <div class="verse-content" id="verseContent"></div>
                </div>

                <div class="navigation-controls">
                    <button class="nav-btn" id="prevBtn" onclick="previousVerse()">←</button>
                    <button class="toggle-btn" id="toggleBtn" onclick="toggleVerse()">Reveal 顯示</button>
                    <button class="nav-btn" id="nextBtn" onclick="nextVerse()">→</button>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="backToMenu()">⬅ Back to Menu 回選單</button>
                </div>
            `;

            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('resumeBanner').classList.remove('show');
        }

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            if (modal.classList.contains('show')) {
                modal.classList.remove('show');
            } else {
                modal.classList.add('show');
            }
        }

        function viewStats() {
            const practiced = localStorage.getItem('totalPracticed') || '0';
            const lastDate = localStorage.getItem('lastPractice') || '未練習';
            const bookmarkCount = bookmarks.length;

            alert(`📊 統計資料 | Statistics

` +
                  `✅ 總練習次數 | Total Practiced: ${practiced} 次
` +
                  `🔖 書籤數量 | Bookmarks: ${bookmarkCount}
` +
                  `📅 最後練習 | Last Practice: ${lastDate}`);
        }

        function exportData() {
            const data = {
                totalPracticed: localStorage.getItem('totalPracticed') || '0',
                lastPractice: localStorage.getItem('lastPractice') || 'Never',
                bookmarks: bookmarks,
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `14basic_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();

            alert('資料已匯出！Data exported!');
        }

        function resetProgress() {
            if (confirm('確定要重置所有進度和書籤嗎？此操作無法復原。

Are you sure you want to reset all progress and bookmarks? This cannot be undone.')) {
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(BOOKMARK_KEY);
                localStorage.removeItem('totalPracticed');
                localStorage.removeItem('lastPractice');
                bookmarks = [];
                updateStats();
                alert('已重置所有資料！All data has been reset!');
                toggleSettings();
            }
        }

        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        document.getElementById('installBanner').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('installBanner').classList.remove('show');
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw_14basic_v3.js')
                .then(reg => console.log('Service Worker registered', reg))
                .catch(err => console.log('Service Worker registration failed', err));
        }

        // Offline Detection
        window.addEventListener('online', () => {
            document.getElementById('offlineIndicator').classList.remove('show');
        });

        window.addEventListener('offline', () => {
            document.getElementById('offlineIndicator').classList.add('show');
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('settingsModal');
            if (e.target === modal) {
                toggleSettings();
            }
        });

        // Initialize
        loadSavedData();
    </script>
</body>
</html>
